<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Portfolio Message — Arvin Joy M. Pangalo</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;">

    <!-- Outer Wrapper -->
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f1f5f9; width: 100%; border-collapse: collapse; margin: 0; padding: 0;">
        <tr>
            <td align="center" style="padding: 16px 8px;">
                
                <!-- Main Card Container (Fluid 100%, max 560px) -->
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 560px; width: 100%; background-color: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; border-collapse: collapse; overflow: hidden; box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);">
                    
                    <!-- Header Section -->
                    <tr>
                        <td style="background-color: #0f172a; padding: 18px 20px; border-bottom: 1px solid #1e293b;">
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse: collapse;">
                                <tr>
                                    <!-- Avatar & Name -->
                                    <td valign="middle">
                                        <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
                                            <tr>
                                                <td valign="middle" style="width: 38px; height: 38px; padding-right: 12px;">
                                                    <!-- Perfectly round avatar circle -->
                                                    <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse; width: 38px; height: 38px;">
                                                        <tr>
                                                            <td align="center" valign="middle" style="width: 38px; height: 38px; min-width: 38px; min-height: 38px; max-width: 38px; max-height: 38px; background-color: #2563eb; border-radius: 50%; color: #ffffff; font-weight: bold; font-size: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1;">
                                                                AP
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </td>
                                                <td valign="middle">
                                                    <div style="font-size: 15px; font-weight: 700; color: #ffffff; line-height: 1.2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
                                                        Arvin Joy M. Pangalo
                                                    </div>
                                                    <div style="font-size: 11px; color: #94a3b8; margin-top: 2px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
                                                        Portfolio Inbound Message
                                                    </div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                    <!-- Badge -->
                                    <td align="right" valign="middle" style="padding-left: 8px;">
                                        <div style="display: inline-block; background-color: rgba(37, 99, 235, 0.2); border: 1px solid rgba(59, 130, 246, 0.5); color: #93c5fd; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 4px 8px; border-radius: 9999px; white-space: nowrap; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
                                            New Lead
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Subject Header Strip -->
                    <tr>
                        <td style="background-color: #f8fafc; padding: 14px 20px; border-bottom: 1px solid #e2e8f0;">
                            <div style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; color: #64748b; margin-bottom: 4px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
                                SUBJECT
                            </div>
                            <div style="font-size: 16px; font-weight: 700; color: #0f172a; line-height: 1.35; word-break: break-word; overflow-wrap: break-word; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
                                {{subject}}
                            </div>
                        </td>
                    </tr>

                    <!-- Main Content Body -->
                    <tr>
                        <td style="padding: 20px 20px;">
                            
                            <!-- Sender Metadata Box -->
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 18px; border-collapse: collapse;">
                                <tr>
                                    <td style="padding: 12px 14px;">
                                        <!-- Sender Name -->
                                        <div style="margin-bottom: 8px;">
                                            <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #64748b; margin-bottom: 2px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
                                                SENDER NAME
                                            </div>
                                            <div style="font-size: 14px; font-weight: 700; color: #0f172a; word-break: break-word; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
                                                {{from_name}}
                                            </div>
                                        </div>

                                        <!-- Sender Email -->
                                        <div>
                                            <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #64748b; margin-bottom: 2px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
                                                EMAIL ADDRESS
                                            </div>
                                            <div style="font-size: 13px; font-weight: 600; word-break: break-all; overflow-wrap: anywhere; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
                                                <a href="mailto:{{from_email}}" style="color: #2563eb; text-decoration: none;">
                                                    {{from_email}}
                                                </a>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </table>

                            <!-- Message Content Label -->
                            <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #475569; margin-bottom: 6px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
                                MESSAGE CONTENT
                            </div>

                            <!-- Message Content Box -->
                            <div style="background-color: #ffffff; border: 1px solid #cbd5e1; border-left: 4px solid #2563eb; border-radius: 6px; padding: 14px 16px; font-size: 14px; line-height: 1.6; color: #1e293b; white-space: pre-wrap; word-break: break-word; overflow-wrap: break-word; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; box-sizing: border-box;">
{{message}}
                            </div>

                            <!-- Reply CTA Button -->
                            <div style="margin-top: 20px; text-align: center;">
                                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse: collapse;">
                                    <tr>
                                        <td align="center">
                                            <a href="mailto:{{from_email}}?subject=Re: {{subject}}" target="_blank" style="display: block; width: 100%; max-width: 100%; box-sizing: border-box; background-color: #2563eb; color: #ffffff !important; text-decoration: none; font-weight: 700; font-size: 14px; padding: 12px 18px; border-radius: 9999px; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
                                                Reply to {{from_name}}
                                            </a>
                                        </td>
                                    </tr>
                                </table>
                            </div>

                        </td>
                    </tr>

                    <!-- Bottom Divider -->
                    <tr>
                        <td style="padding: 0 20px;">
                            <div style="height: 1px; background-color: #e2e8f0; width: 100%;"></div>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 16px 20px; text-align: center; background-color: #fafbfc;">
                            <div style="font-size: 11px; color: #64748b; line-height: 1.5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
                                Sent from Developer Portfolio • <a href="https://github.com/aj-tech-24" style="color: #2563eb; text-decoration: none; font-weight: 600;">github.com/aj-tech-24</a>
                            </div>
                        </td>
                    </tr>

                </table>
                <!-- End Main Card Container -->

            </td>
        </tr>
    </table>
    <!-- End Outer Wrapper -->

</body>
</html>
